# =============================================================================
# 飞鸽传书小程序后端 · 生产环境 TKE 部署清单
# 适配集群版本: apiVersion apps/v1beta2 (k8s <=1.15, 与 mobile-miniapp-tool 同款规范)
# 部署方式: 腾讯云控制台 -> TKE 上海集群 -> 工作负载 -> 新建 -> 编辑YAML 整段粘贴
# 上线换镜像: 只更新下方 image 的 tag 后保存(滚动更新)
# ⚠️ ⚠️ imagePullSecrets 是命名空间级资源: 部署前需把 qcloudregistrykey1 从
#    mobile-tool 复制到 feige-pigeon(见文档), 否则 ImagePullBackOff。
# ⚠️ replicas 必须为 1: 应用内 Quartz 使用 RAMJobStore 无分布式锁,
#    多副本会导致定时任务重复执行; 扩副本前需先改造调度。
# =============================================================================
apiVersion: apps/v1beta2
kind: Deployment
metadata:
  annotations:
    description: 飞鸽传书微信小程序后端(SpringBoot单jar, 内置Quartz定时任务)
  labels:
    k8s-app: miniapp-feige
    qcloud-app: miniapp-feige
  name: miniapp-feige
  namespace: feige-pigeon
spec:
  progressDeadlineSeconds: 600
  replicas: 1                       # ⚠️ 见文件头说明
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      k8s-app: miniapp-feige
      qcloud-app: miniapp-feige
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0             # 与现有服务一致: 先起新再停旧, 保证始终有实例
    type: RollingUpdate
  template:
    metadata:
      labels:
        k8s-app: miniapp-feige
        qcloud-app: miniapp-feige
    spec:
      containers:
        - name: miniapp-feige
          # ── 上线时仅更新此 tag ──
          image: ccr.ccs.tencentyun.com/feige-pigeon/feige-pigeon:<2026-08-27_1709>
          imagePullPolicy: IfNotPresent
          env:
            # 运行时配置(生产值按需替换 <...> 占位)
            - name: TZ
              value: Asia/Shanghai
            - name: FG_PORT
              value: '8080'
            - name: FG_DEV_LOGIN
              value: 'false'                    # ⚠️ 生产必须 false
            - name: SPRING_DATASOURCE_URL
              value: 'jdbc:mysql://172.17.0.200:3389/feige_pigeon?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai'
            - name: SPRING_DATASOURCE_USERNAME
              value: 'soogif'
            - name: SPRING_DATASOURCE_PASSWORD
              value: 'BuDong20181220!'
            - name: FG_WECHAT_APPID
              value: '<正式小程序AppID>'
            - name: FG_WECHAT_SECRET
              value: '<正式小程序Secret>'
            - name: FG_SIGN_SECRET
              value: 'dev_soogif_feige'
            - name: FG_ARRIVAL_TEMPLATE_ID
              value: ''
            # 堆显式收窄以匹配容器限额(limit 1.5Gi): 默认镜像内置 -Xmx1024m 会偏挤
            - name: JAVA_OPTS
              value: '-Xms512m -Xmx896m'
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /v2/api-docs, port: 8080}
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /v2/api-docs, port: 8080}
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m           # 与 tool 同规格; 堆896m配1.5Gi留足非堆空间
              memory: 1536Mi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            privileged: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: qcloudregistrykey1   # 复用集群既有个人版镜像仓凭据(已在feige-pigeon命名空间复制)
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30   # SpringBoot graceful shutdown 余量充足
---
# =============================================================================
# Service：复用既有内网CLB(lb-6ddftbs7, VIP 172.17.16.112)，feige占用新端口48081
# 外层统一网关把 域名/路径 反代到 172.17.16.112:48081 即完成暴露
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  annotations:
    description: mobile-miniapp-feige
    service.kubernetes.io/qcloud-loadbalancer-clusterid: cls-o1k7q0d9
    service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: subnet-q9v7u42n
    service.kubernetes.io/qcloud-share-existed-lb: 'true'
    service.kubernetes.io/tke-existed-lbid: lb-6ddftbs7
  name: mobile-miniapp-feige
  namespace: feige-pigeon
spec:
  type: LoadBalancer
  selector:
    k8s-app: mobile-miniapp-feige
    qcloud-app: mobile-miniapp-feige
  ports:
    - name: tcp-feige-pigeon
      port: 48081            # CLB监听端口(若被占用按空闲顺延)
      targetPort: 8080       # 容器内FG_PORT
      protocol: TCP
